<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry...</title>

    <style>
        body {
            font-family: 'Comic Sans MS', cursive;
            background-color: #ffe6f2;
            text-align: center;
            padding: 40px;
            overflow-x: hidden;
            position: relative;
        }

        h1 {
            font-size: 28px;
            color: #ff4d88;
        }

        button {
            background: #ff66a3;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button:hover {
            background: #ff3385;
        }

        #content {
            display: none;
            margin-top: 25px;
            animation: fadeIn 1s ease-in-out;
        }

        #content img {
            width: 220px;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        /* Flowers */
        .flower {
            position: fixed;
            top: -30px;
            font-size: 28px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>

<body>

    <h1>Hey... I need to tell you something 💖</h1>
    <button onclick="startEffect()">Click Me 🌸</button>

    <div id="content">
        <img src="https://media.tenor.com/k1c8LA2GdE4AAAAi/tkthao219-bubududu.gif">
        <h2>I’m really sorry for not picking up your calls 😔</h2>
        <p>You mean a lot to me… please don’t stay mad ❤️</p>
    </div>

    <script>
        function startEffect() {
            document.getElementById("content").style.display = "block";
            rainFlowers();
        }

        function rainFlowers() {
            const flowers = ["🌸","🌺","💮","🌼","🌷"];

            for (let i = 0; i < 40; i++) {
                let f = document.createElement("div");
                f.className = "flower";
                f.textContent = flowers[Math.floor(Math.random() * flowers.length)];

                f.style.left = Math.random() * window.innerWidth + "px";
                f.style.animationDuration = (2.5 + Math.random() * 2) + "s";

                document.body.appendChild(f);

                setTimeout(() => f.remove(), 4000);
            }
        }
    </script>

</body>
</html>
