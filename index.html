<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry...</title>

    <style>
        body {
            font-family: 'Comic Sans MS', cursive;
            background-color: #ffe6f2;
            text-align: center;
            padding: 40px;
            overflow-x: hidden;
        }

        h1 {
            font-size: 28px;
            color: #ff4d88;
        }

        button {
            background: #ff66a3;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button:hover {
            background: #ff3385;
        }

        #content {
            display: none;
            margin-top: 25px;
            animation: fadeIn 1s ease-in-out;
        }

        #content img {
            width: 220px;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        /* Flower Animation */
        .flower {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Hey... I need to tell you something 💖</h1>
    <button onclick="showApology()">Click Me 🌸</button>

    <div id="content">
        <img src="https://media.tenor.com/k1c8LA2GdE4AAAAi/tkthao219-bubududu.gif" alt="cute teddy">
        <h2>I’m really sorry for not picking up your calls 😔</h2>
        <p>You mean a lot to me… please don’t stay mad ❤️</p>
    </div>

    <script>
        function showApology() {
            document.getElementById("content").style.display = "block";
            createFlowers();
        }

        function createFlowers() {
            const flowers = ["🌸","💮","🌺","🌷","🌼"];

            for (let i = 0; i < 25; i++) {
                let flower = document.createElement("div");
                flower.className = "flower";
                flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];

                flower.style.left = Math.random() * window.innerWidth + "px";
                flower.style.animationDuration = (2 + Math.random() * 2) + "s";

                document.body.appendChild(flower);

                setTimeout(() => flower.remove(), 3000);
            }
        }
    </script>

</body>
</html>
